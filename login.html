<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VICKY WEB</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #1877f2;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #0866d5;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #loginStatus {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link {
            margin-top: 20px;
            display: block;
        }

        a {
            color: #1877f2;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>VICKY WEB</h1>

        <p>Welcome back! Login to meet your friends.</p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <p id="loginStatus" role="status"></p>

        <span class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </span>

    </div>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
