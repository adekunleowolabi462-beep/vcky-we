<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Vicky Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-brand">
        <a href="index.html">VICKY<span>WEB</span></a>
        <h1>Join Our Community!</h1>
        <p>Meet new friends, share your pictures and connect with the world.</p>
    </div>

    <div class="auth-box">

        <h2>Create Account</h2>
        <p class="auth-subtitle">Join Vicky Web for free today.</p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label>Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>

            <label>Email Address</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="Create a password" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit" class="auth-button">Create My Account</button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

        <a href="index.html" class="back-home">← Back to Home</a>

    </div>

</div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
